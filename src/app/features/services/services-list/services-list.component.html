<section class="py-20 bg-gray-50 min-h-screen">

  <div class="container mx-auto px-6">

    <h1 class="text-6xl font-serif text-center mb-4">
      Photography Services
    </h1>

    <p class="text-center text-gray-600 mb-16 text-xl">
      Capturing your most precious moments beautifully
    </p>

    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-10">

      <div
        *ngFor="let service of services"
        class="bg-white rounded-3xl overflow-hidden shadow-xl hover:shadow-2xl transition duration-500">

        <img
          [src]="service.image"
          [alt]="service.name"
          class="w-full h-80 object-cover">

        <div class="p-8">

          <h3 class="text-3xl font-serif mb-4">
            {{service.name}}
          </h3>

          <p class="text-gray-600 mb-6">
            {{service.description}}
          </p>

          <a
  [href]="service.driveLink"
  target="_blank"
  rel="noopener noreferrer"
  class="text-amber-600 font-semibold hover:text-amber-700">
  View Gallery →
</a>

        </div>

      </div>

    </div>

  </div>

</section>
