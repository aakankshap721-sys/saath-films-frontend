<div class="container mx-auto px-6 py-12">
  <div class="grid md:grid-cols-2 gap-12">
    <div>
      <img [src]="service.coverImage" class="rounded-3xl w-full">
    </div>
    <div>
      <h1 class="text-5xl font-serif">{{service.name}}</h1>
      <p class="text-3xl text-accent mt-4">Starting at ₹{{service.startingPrice}}</p>
      
      <div class="mt-10" [innerHTML]="service.description"></div>
      
      <a routerLink="/booking" class="mt-10 inline-block bg-black text-white px-12 py-5 rounded-full text-lg">
        Book This Service
      </a>
    </div>
  </div>
</div>
